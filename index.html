        * {

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;

        body {
            font-family: 'Fredoka', 'Nunito', 'Comic Sans MS', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #6225E6 0%, #8C52FF 40%, #FF66C4 100%);

        /* Animated Floating Bubbles Background */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
            animation: floatUp 12s infinite linear;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.8) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Tactile 3D Buttons */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2), 0 15px 20px rgba(0,0,0,0.25);
        }
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.2);
        }

        /* Gentle Bounce Keyframe */
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        .animate-bounce-gentle {
            animation: gentleBounce 2.5s infinite ease-in-out;
        }

        /* Star Sparkle */
        @keyframes starGlow {
            0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 5px #fbe04d); }
            50% { transform: scale(1.2) rotate(15deg); filter: drop-shadow(0 0 15px #f59e0b); }
        }
        .star-sparkle {
            animation: starGlow 2s infinite ease-in-out;
        }

        /* Custom Scrollbar for inner cards if needed */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>

        // --- SOUND ENGINE (WEB AUDIO API & SPEECH SYNTHESIS) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-xl';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-xl text-red-500';
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(160, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'fanfare') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.2, now + idx * 0.12);
                    g.gain.linearRampToValueAtTime(0.01, now + idx * 0.12 + 0.25);
                    o.start(now + idx * 0.12);
                    o.stop(now + idx * 0.12 + 0.25);
                });
            }
        }

        function speakEnglish(text) {
            if (!soundEnabled) return;

            } else if (state.currentView === 'group_select') {
                backBtn.classList.remove('hidden');
                const subj = GAME_DATA[state.selectedSubject];
                titleEl.innerText = subj.title;
                main.innerHTML = `
                    <div class="flex flex-col gap-5 w-full max-w-2xl px-2">
                        ${subj.groups.map((group, idx) => `
                            <button onclick="selectGroup(${idx})" class="bg-white/95 text-slate-800 rounded-3xl p-5 md:p-6 border-4 border-white shadow-2xl flex items-center justify-between text-left btn-3d">
                                <div class="flex items-center gap-5">
                                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${group.gradient} text-white flex items-center justify-center text-3xl shadow-md">
                                        <i class="fa-solid ${group.icon}"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-2xl md:text-3xl font-black text-purple-950">${group.title}</h3>
                                        <p class="text-purple-600 font-extrabold text-base">3 завдання • ⭐⭐⭐</p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-circle-chevron-right text-4xl text-purple-400"></i>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (state.currentView === 'task_select') {
                backBtn.classList.remove('hidden');
                const subj = GAME_DATA[state.selectedSubject];
                const group = subj.groups[state.selectedGroupIndex];
                titleEl.innerText = group.title;
                main.innerHTML = `
                    <div class="flex flex-col gap-5 w-full max-w-2xl px-2">
                        ${group.subTasks.map((sub, idx) => {
                            const taskId = `${state.selectedSubject}_${state.selectedGroupIndex}_${idx}`;
                            const isDone = state.completedTasks[taskId];
                            return `
                                <button onclick="selectTask(${idx})" class="bg-white/95 text-slate-800 rounded-3xl p-5 md:p-6 border-4 border-white shadow-2xl flex items-center justify-between text-left btn-3d">
                                    <div class="flex items-center gap-4">
                                        <div class="w-14 h-14 rounded-2xl ${isDone ? 'bg-amber-400 text-white' : 'bg-purple-100 text-purple-700'} flex items-center justify-center text-2xl font-black border-2 border-purple-200">
                                            ${isDone ? '⭐' : (idx + 1)}
                                        </div>
                                        <span class="text-2xl md:text-3xl font-black text-purple-950">${sub.title}</span>
                                    </div>
                                    <div class="flex items-center gap-2 text-amber-500 text-xl font-black bg-amber-50 px-4 py-2 rounded-2xl border border-amber-200">
                                        <span>3 вправи</span>
                                        <i class="fa-solid fa-play"></i>
                                    </div>
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            } else if (state.currentView === 'exercise') {
                backBtn.classList.remove('hidden');
                const subj = GAME_DATA[state.selectedSubject];
                const group = subj.groups[state.selectedGroupIndex];
                const task = group.subTasks[state.selectedTaskIndex];
                const ex = task.exercises[state.currentExerciseIndex];

                titleEl.innerText = `${task.title}`;
                
                main.innerHTML = `
                    <div class="bg-white/95 backdrop-blur-md rounded-3xl p-6 md:p-8 border-4 border-white shadow-2xl w-full max-w-2xl flex flex-col items-center gap-6">
                        <!-- PROGRESS BAR -->
                        <div class="flex items-center justify-between w-full border-b-2 border-purple-100 pb-4">
                            <span class="font-black text-purple-900 text-xl">Вправа ${state.currentExerciseIndex + 1} з 3</span>
                            <div class="flex gap-2">
                                ${[0, 1, 2].map(i => `
                                    <div class="w-5 h-5 rounded-full ${i === state.currentExerciseIndex ? 'bg-amber-400 scale-125 border-2 border-amber-600' : (i < state.currentExerciseIndex ? 'bg-emerald-400' : 'bg-slate-200')} transition-all"></div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- EXERCISE DYNAMIC CONTAINER -->
                        <div class="w-full flex flex-col items-center justify-center min-h-[240px]">
                            ${renderExerciseUI(ex)}
                        </div>
                    </div>
                `;
            }
        }

        // --- RENDER EXERCISE TYPES ---
        function renderExerciseUI(ex) {
            if (ex.type === 'choice') {
                return `
                    <h2 class="text-3xl md:text-4xl font-black text-center text-purple-950 mb-8">${ex.q}</h2>
                    <div class="grid grid-cols-3 gap-4 w-full">
                        ${ex.options.map(opt => `
                            <button onclick="handleAnswer('${opt}', '${ex.a}')" class="bg-gradient-to-b from-purple-100 to-indigo-200 hover:from-purple-200 hover:to-indigo-300 border-4 border-indigo-300 text-purple-950 text-3xl md:text-4xl font-black py-6 rounded-2xl shadow-lg btn-3d">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (ex.type === 'fill_shapes') {
                state.tempState.count = state.tempState.count !== undefined ? state.tempState.count : ex.current;
                const count = state.tempState.count;
                return `
                    <h2 class="text-2xl md:text-3xl font-black text-center text-purple-950 mb-3">${ex.text}</h2>
                    <div class="text-2xl font-black text-purple-700 mb-2">Фігур у рамці: <span class="text-3xl text-pink-600">${count}</span> / ${ex.target}</div>
                    <div class="flex flex-wrap justify-center gap-3 bg-purple-50 p-6 rounded-3xl w-full min-h-[110px] border-4 border-dashed border-purple-200 mb-6">
                        ${Array(count).fill(ex.shape).map(s => `<span class="text-5xl animate-bounce-gentle">${s}</span>`).join('')}
                    </div>
                    <button onclick="addShape(${ex.target})" class="bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white text-2xl font-black py-4 px-10 rounded-2xl border-b-4 border-teal-700 shadow-xl btn-3d">
                        ➕ Додати ${ex.shape}
                    </button>
                `;
            } else if (ex.type === 'count_sum') {
                return `
                    <div class="flex items-center justify-center gap-4 text-4xl mb-6 bg-purple-50 p-5 rounded-3xl border-2 border-purple-200 w-full shadow-inner">
                        <div>${Array(ex.setA).fill(ex.shape).join('')}</div>
                        <span class="font-black text-purple-900 text-4xl">+</span>
                        <div>${Array(ex.setB).fill(ex.shape).join('')}</div>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-black text-purple-950 mb-6">Скільки всього предметів?</h3>
                    <div class="grid grid-cols-3 gap-4 w-full">
                        ${ex.options.map(opt => `
                            <button onclick="handleAnswer(${opt}, ${ex.a})" class="bg-gradient-to-b from-amber-100 to-yellow-200 border-4 border-amber-300 text-amber-950 text-4xl font-black py-6 rounded-2xl shadow-lg btn-3d">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (ex.type === 'compare') {
                return `
                    <div class="flex items-center justify-center gap-6 text-3xl font-black mb-6 w-full">
                        <div class="bg-amber-50 p-4 rounded-3xl border-2 border-amber-200 text-center flex-1 shadow-inner">
                            <div class="text-4xl mb-2">${Array(ex.count).fill(ex.shape).join('')}</div>
                            <span class="text-3xl text-amber-950">${ex.count}</span>
                        </div>
                        <span class="text-5xl text-purple-800 font-black">?</span>
                        <div class="bg-blue-50 p-4 rounded-3xl border-2 border-blue-200 text-center flex-1 shadow-inner">
                            <span class="text-6xl text-blue-900 font-black">${ex.compareTo}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-4 w-full">
                        ${ex.options.map(opt => `
                            <button onclick="handleAnswer('${opt}', '${ex.a}')" class="bg-purple-100 hover:bg-purple-200 text-purple-950 text-4xl font-black py-6 rounded-2xl border-4 border-purple-300 shadow-lg btn-3d">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (ex.type === 'find_color') {
                return `
                    <h2 class="text-3xl font-black text-purple-950 mb-6 text-center">${ex.q}</h2>
                    <div class="grid grid-cols-3 gap-6 w-full">
                        ${ex.options.map((opt, idx) => `
                            <button onclick="handleAnswer(${idx}, ${ex.a})" class="h-32 ${opt.c} rounded-3xl shadow-xl border-4 border-white flex items-center justify-center btn-3d">
                                <div class="${opt.s === 'circle' ? 'w-14 h-14 rounded-full bg-white/40' : (opt.s === 'square' ? 'w-14 h-14 bg-white/40 rounded-xl' : 'w-0 h-0 border-l-[24px] border-l-transparent border-r-[24px] border-r-transparent border-b-[40px] border-b-white/40')}"></div>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (ex.type === 'collect_items') {
                state.tempState.count = state.tempState.count !== undefined ? state.tempState.count : 0;
                const count = state.tempState.count;
                return `
                    <h2 class="text-2xl md:text-3xl font-black text-purple-950 mb-2 text-center">${ex.text}</h2>
                    <div class="text-3xl font-black text-amber-500 mb-6">Зібрано: ${count} / ${ex.target}</div>
                    <div class="flex justify-center items-center h-32 w-full bg-purple-50 rounded-3xl border-4 border-purple-200 mb-6 shadow-inner">
                        <button onclick="collectItem(${ex.target})" class="text-7xl animate-bounce-gentle active:scale-125 transition-transform btn-3d">
                            ${ex.item}
                        </button>
                    </div>
                `;
            } else if (ex.type === 'flashcard') {
                return `
                    <div class="flex flex-col items-center gap-4">
                        <div class="text-8xl mb-1 animate-bounce-gentle">${ex.emoji}</div>
                        <div class="text-5xl font-black text-purple-950">${ex.word}</div>
                        <div class="text-2xl font-extrabold text-purple-600 bg-purple-100 px-6 py-1.5 rounded-full">${ex.t}</div>
                        <button onclick="speakEnglish('${ex.word}')" class="mt-2 bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white font-black py-3.5 px-8 rounded-2xl border-b-4 border-rose-700 shadow-lg flex items-center gap-3 text-2xl btn-3d">
                            <i class="fa-solid fa-volume-high text-2xl"></i> Послухати
                        </button>
                        <button onclick="nextExercise()" class="mt-4 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black py-4 px-12 rounded-2xl border-b-4 border-teal-700 shadow-xl text-2xl btn-3d">
                            Далі ➔
                        </button>
                    </div>
                `;
            } else if (ex.type === 'listen_choose') {
                return `
                    <div class="flex flex-col items-center gap-6 w-full">
                        <button onclick="speakEnglish('${ex.word}')" class="bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white font-black py-4 px-8 rounded-2xl border-b-4 border-rose-700 shadow-xl flex items-center gap-3 text-2xl btn-3d">
                            <i class="fa-solid fa-volume-high text-3xl"></i> Послухати слово
                        </button>
                        <div class="grid grid-cols-3 gap-4 w-full">
                            ${ex.options.map((opt, idx) => `
                                <button onclick="handleAnswer(${idx}, ${ex.a})" class="bg-purple-50 hover:bg-purple-100 border-4 border-purple-200 p-6 rounded-3xl flex flex-col items-center gap-2 shadow-lg btn-3d">
                                    <span class="text-6xl">${opt.e}</span>
                                    <span class="text-2xl font-black text-purple-950">${opt.w}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (ex.type === 'spell') {
                state.tempState.spelled = state.tempState.spelled || '';
                const current = state.tempState.spelled;
                const letters = ex.word.split('').sort(() => Math.random() - 0.5);
                return `
                    <div class="flex flex-col items-center gap-4 w-full">
                        <div class="text-7xl mb-1">${ex.emoji}</div>
                        <div class="text-4xl font-black tracking-widest bg-purple-50 py-3 px-8 rounded-2xl border-4 border-purple-200 min-w-[220px] text-center text-purple-950 shadow-inner">
                            ${current || '_ _ _'}
                        </div>
                        <div class="flex gap-3 mt-4">
                            ${letters.map((char, idx) => `
                                <button onclick="addLetter('${char}', '${ex.word}')" class="bg-gradient-to-b from-amber-300 to-yellow-400 hover:from-amber-400 hover:to-yellow-500 text-amber-950 text-4xl font-black w-18 h-18 p-4 rounded-2xl shadow-lg border-b-4 border-amber-600 btn-3d">
                                    ${char}
                                </button>
                            `).join('')}
                        </div>
                        <button onclick="state.tempState.spelled = ''; render();" class="text-purple-500 font-extrabold mt-2 underline">Очистити</button>
                    </div>
                `;
            } else if (ex.type === 'match_word') {
                return `
                    <div class="flex flex-col items-center gap-6 w-full">
                        <div class="text-4xl font-black text-purple-950 bg-purple-100 px-8 py-3 rounded-2xl border-2 border-purple-300 shadow">${ex.word}</div>
                        <div class="grid grid-cols-3 gap-4 w-full">
                            ${ex.options.map((emoji, idx) => `
                                <button onclick="handleAnswer(${idx}, ${ex.a})" class="bg-slate-50 hover:bg-slate-100 border-4 border-slate-200 text-7xl py-6 rounded-3xl shadow-lg btn-3d">
                                    ${emoji}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (ex.type === 'count_family') {
                return `
                    <div class="flex flex-col items-center gap-4 w-full">
                        <div class="text-4xl md:text-5xl tracking-widest text-center mb-2 bg-pink-50 p-4 rounded-3xl border-2 border-pink-200 w-full shadow-inner">${ex.items}</div>
                        <h2 class="text-2xl font-black text-purple-950 text-center mb-4">${ex.q}</h2>
                        <div class="grid grid-cols-3 gap-4 w-full">
                            ${ex.options.map(opt => `
                                <button onclick="handleAnswer(${opt}, ${ex.a})" class="bg-gradient-to-b from-pink-100 to-rose-200 text-pink-950 text-4xl font-black py-5 rounded-2xl border-4 border-pink-300 shadow-lg btn-3d">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (ex.type === 'give_balloons') {
                state.tempState.count = state.tempState.count !== undefined ? state.tempState.count : 0;
                const count = state.tempState.count;
                return `
                    <h2 class="text-2xl font-black text-purple-950 mb-2 text-center">${ex.text}</h2>
                    <div class="text-3xl font-black text-amber-500 mb-4">${count} / ${ex.target}</div>
                    <div class="flex flex-wrap justify-center gap-2 bg-purple-50 p-4 rounded-3xl w-full min-h-[90px] mb-4 border-2 border-purple-200 shadow-inner">
                        ${Array(count).fill(ex.emoji).map(s => `<span class="text-4xl animate-bounce-gentle">${s}</span>`).join('')}
                    </div>
                    <button onclick="collectItem(${ex.target})" class="bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white text-2xl font-black py-4 px-10 rounded-2xl border-b-4 border-pink-700 shadow-xl btn-3d">
                        Подарувати ${ex.emoji}
                    </button>
                `;
            }
        }

        // --- NAVIGATION HANDLERS ---
        function selectSubject(subj) {
            playSound('pop');
            state.selectedSubject = subj;
            state.currentView = 'group_select';
            render();
        }

        function selectGroup(groupIdx) {
            playSound('pop');
            state.selectedGroupIndex = groupIdx;
            state.currentView = 'task_select';
            render();
        }

        function selectTask(taskIdx) {
            playSound('pop');
            state.selectedTaskIndex = taskIdx;
            state.currentExerciseIndex = 0;
            state.tempState = {};
            state.currentView = 'exercise';
            render();
        }

        function navigateBack() {
            playSound('pop');
            if (state.currentView === 'exercise') {
                state.currentView = 'task_select';
            } else if (state.currentView === 'task_select') {
                state.currentView = 'group_select';
            } else if (state.currentView === 'group_select') {
                state.currentView = 'subject_select';
            }
            render();
        }

        function handleAnswer(userAns, correctAns) {
            if (String(userAns) === String(correctAns)) {
                playSound('correct');
                nextExercise();
            } else {
                playSound('wrong');
            }
        }

        function addShape(target) {
            playSound('pop');
            state.tempState.count = (state.tempState.count || 0) + 1;
            if (state.tempState.count === target) {
                playSound('correct');
                setTimeout(nextExercise, 400);
            } else {
                render();
            }
        }

        function collectItem(target) {
            playSound('pop');
            state.tempState.count = (state.tempState.count || 0) + 1;
            if (state.tempState.count === target) {
                playSound('correct');
                setTimeout(nextExercise, 400);
            } else {
                render();
            }
        }

        function addLetter(char, targetWord) {
            playSound('pop');
            state.tempState.spelled = (state.tempState.spelled || '') + char;
            if (state.tempState.spelled === targetWord) {
                playSound('correct');
                setTimeout(nextExercise, 400);
            } else if (state.tempState.spelled.length >= targetWord.length) {
                playSound('wrong');
                state.tempState.spelled = '';
                render();
            } else {
                render();
            }
        }

        function nextExercise() {
            state.tempState = {};
            if (state.currentExerciseIndex < 2) {
                state.currentExerciseIndex++;
                render();
            } else {
                const taskId = `${state.selectedSubject}_${state.selectedGroupIndex}_${state.selectedTaskIndex}`;
                if (!state.completedTasks[taskId]) {
                    state.completedTasks[taskId] = true;
                    state.stars += 3;
                }
                playSound('fanfare');
                triggerConfetti();
                document.getElementById('victory-modal').classList.remove('hidden');
            }
        }

        function closeVictoryModal() {
            playSound('pop');
            document.getElementById('victory-modal').classList.add('hidden');
            state.currentView = 'task_select';
            render();
        }

        // --- BACKGROUND BUBBLES GENERATOR ---
        function createBubbles() {
            const container = document.getElementById('bubbles-container');
            const colors = ['#FFD166', '#06D6A0', '#118AB2', '#EF476F', '#FFC6FF'];
            for (let i = 0; i < 15; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 60 + 20;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDelay = `${Math.random() * 10}s`;
                bubble.style.animationDuration = `${Math.random() * 8 + 8}s`;
                bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(bubble);
            }
        }

        // --- SIMPLE CONFETTI CANVAS ANIMATION ---
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#FFD166', '#06D6A0', '#118AB2', '#EF476F', '#FFC6FF'];

            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 16,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.4; // gravity
                    p.size *= 0.98;
                    if (p.size > 0.5) active = true;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                if (active) requestAnimationFrame(animateConfetti);
            }
            animateConfetti();
        }

        // INITIAL LOAD
        window.onload = function() {
            createBubbles();
            render();
        };
    </script>
</body>
</html>
